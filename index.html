<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite Discipline Terminal</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/recharts@2.8.0/umd/Recharts.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#020609;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#e8f0f8;height:100vh;overflow:hidden}
#root{height:100vh;overflow:hidden}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes lockIn{0%{transform:scale(0.3);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.bgrid{position:fixed;inset:0;background-image:linear-gradient(rgba(240,192,64,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(240,192,64,0.015) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden}
.scroll::-webkit-scrollbar{width:2px}
.scroll::-webkit-scrollbar-thumb{background:rgba(240,192,64,0.3);border-radius:99px}
.gl{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:16px}
.gl2{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.13);border-radius:11px}
.ei{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.14);border-radius:9px;color:#e8f0f8;padding:10px 12px;font-size:13px;width:100%;outline:none;transition:border-color 0.2s;font-family:inherit}
.ei:focus{border-color:rgba(240,192,64,0.5)}
.bn{background:linear-gradient(135deg,rgba(240,192,64,0.14),rgba(240,192,64,0.07));border:1px solid rgba(240,192,64,0.4);color:#f0c040;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:12px 18px;border-radius:11px;cursor:pointer;font-size:10px;width:100%;transition:all 0.18s;font-family:inherit}
.bn:active{transform:scale(0.97)}.bn:disabled{opacity:0.3;cursor:not-allowed}
.bg{background:transparent;border:1px solid rgba(255,255,255,0.12);color:#7a9090;padding:10px 18px;border-radius:11px;cursor:pointer;font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;width:100%;transition:all 0.18s;font-family:inherit}
.pbt{background:rgba(255,255,255,0.05);border-radius:99px;overflow:hidden}
.pbf{height:100%;border-radius:99px;transition:width 0.5s}
.nb{background:rgba(2,6,9,0.97);border-top:1px solid rgba(255,255,255,0.07);display:flex;flex-shrink:0}
.nvb{flex:1;background:none;border:none;padding:8px 4px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
.tc{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:12px;margin-bottom:8px;border-left:3px solid transparent;cursor:pointer}
.ci{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;background:rgba(255,255,255,0.03);border:1.5px solid rgba(255,255,255,0.08);cursor:pointer;margin-bottom:5px;font-size:11px;font-weight:600;color:#7a9090;transition:all 0.15s}
.ci.on{background:rgba(0,232,122,0.07);border-color:rgba(0,232,122,0.35);color:#00e87a}
.so{padding:8px 7px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid rgba(255,255,255,0.11);background:rgba(255,255,255,0.03);color:#7a9090;transition:all 0.14s;text-align:left;font-family:inherit}
.so.on{background:rgba(240,192,64,0.1);border-color:rgba(240,192,64,0.5);color:#f0c040}
.tb{padding:5px 10px;border-radius:7px;font-size:10px;font-weight:700;cursor:pointer;border:1px solid rgba(255,255,255,0.08);background:transparent;color:#7a9090;letter-spacing:0.8px;transition:all 0.14s;white-space:nowrap;font-family:inherit}
.tb.on{background:rgba(240,192,64,0.12);border-color:rgba(240,192,64,0.4);color:#f0c040}
.eb{padding:5px 8px;border-radius:6px;font-size:10px;font-weight:700;cursor:pointer;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);color:#7a9090;transition:all 0.13s;font-family:inherit}
.eb.on{background:rgba(240,192,64,0.14);border-color:rgba(240,192,64,0.5);color:#f0c040}
.rb{flex:1;padding:16px 7px;border-radius:12px;font-size:14px;font-weight:900;cursor:pointer;border:2px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);color:#7a9090;transition:all 0.18s;text-align:center;font-family:inherit}
.rb.wo{background:rgba(0,232,122,0.12);border-color:rgba(0,232,122,0.6);color:#00e87a}
.rb.lo{background:rgba(255,51,85,0.12);border-color:rgba(255,51,85,0.6);color:#ff3355}
.hdr{background:rgba(2,6,9,0.95);border-bottom:1px solid rgba(255,255,255,0.07);padding:9px 13px;flex-shrink:0}
.bdg{display:inline-flex;align-items:center;padding:2px 7px;border-radius:99px;font-size:8px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}
.sr{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.sr:last-child{border-bottom:none}
.st{font-size:8px;letter-spacing:2.5px;text-transform:uppercase;color:#4a6080;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.st::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.07)}
input[type=range]{accent-color:#f0c040;width:100%;cursor:pointer}
input[type=number]::-webkit-inner-spin-button{opacity:0.4}
textarea.ei{resize:none;min-height:60px}
</style>
</head>
<body>
<div class="bgrid"></div>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useMemo}=React;
const {AreaChart,Area,BarChart,Bar,XAxis,YAxis,Tooltip,ResponsiveContainer,Cell,CartesianGrid}=Recharts;
const C={bg0:"#020609",neon:"#f0c040",green:"#00e87a",red:"#ff3355",blue:"#4fc3f7",purple:"#b44fff",text:"#e8f0f8",muted:"#4a6080",muted2:"#7a9090"};
const SETUPS=["Supply","Demand","Order Block","FVG","Recent Level"];
const CANDLES=["Bearish Engulfing","Bullish Engulfing","Bullish Marubozu","Bearish Marubozu","Morning Star","Evening Star","Others"];
const CW={"Bullish Marubozu":25,"Bearish Marubozu":25,"Bearish Engulfing":20,"Bullish Engulfing":20,"Morning Star":15,"Evening Star":15,"Others":5};
const CHECKS=["Rejection Wick Present","Momentum Candle","Level Respected Before","Clean Market","No Emotional Urge"];
const EMOTIONS=["Calm","Fear","Greed","Revenge","Overconfidence"];
const EI={Calm:"😌",Fear:"😨",Greed:"🤑",Revenge:"😤",Overconfidence:"😎"};
const QUOTES=["Discipline is the bridge between goals and accomplishment.","The market rewards patience and punishes greed.","Two losses? Your mind is not clear. Step away.","Stop. Breathe. Protect your capital.","Elite traders wait. They don't chase."];
const td=()=>new Date().toISOString().slice(0,10);
const fm=n=>"$"+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const fs=n=>(n>=0?"+":"-")+fm(n);
const pc=(a,b)=>b>0?Math.round(a/b*100):0;
const hsh=s=>btoa(unescape(encodeURIComponent(s)));
const cq=(ch,c)=>Math.min(100,ch.length*15+(CW[c]||5));
const LS={
  users:()=>{try{return JSON.parse(localStorage.getItem("edt_u")||"[]")}catch{return[]}},
  saveU:u=>{try{localStorage.setItem("edt_u",JSON.stringify(u))}catch{}},
  data:u=>{try{return JSON.parse(localStorage.getItem("edt_d_"+u)||"null")}catch{return null}},
  saveD:(u,d)=>{try{localStorage.setItem("edt_d_"+u,JSON.stringify(d))}catch{}},
  session:()=>{try{return localStorage.getItem("edt_s")}catch{return null}},
  setS:u=>{try{localStorage.setItem("edt_s",u)}catch{}},
  clearS:()=>{try{localStorage.removeItem("edt_s")}catch{}},
};
const defData=(b=1000)=>({trades:[],balance:b,consec:0,locked:false,settings:{startBal:b,lossLimitPct:10,gainTargetPct:15,maxTrades:10,lossLimit:2}});
const initAdmin=()=>{const u=LS.users();if(!u.length){LS.saveU([{id:1,username:"admin",password:hsh("admin123"),role:"admin",name:"Huzaib Khan",active:true}]);LS.saveD("admin",defData());}};
const buildEq=(trades,sb)=>{let b=sb;const d=[{n:"S",bal:b}];trades.forEach((t,i)=>{b+=t.pnl;d.push({n:"T"+(i+1),bal:parseFloat(b.toFixed(2))})});return d;};
const calcDisc=(data)=>{let s=100;const tt=data.trades.filter(t=>t.date===td());tt.forEach(t=>{if(t.quality>=75)s+=15;else if(t.quality>=50)s+=5;else s-=15;if(t.emotion==="Revenge")s-=25;if(t.emotion==="Calm")s+=5;});if(data.locked)s-=30;const p=tt.reduce((a,t)=>a+t.pnl,0);if(tt.length>0&&p>0)s+=10;return Math.max(0,Math.min(100,Math.round(s)));};
const chkDL=(data)=>{const l=data.settings.startBal*data.settings.lossLimitPct/100;const p=data.trades.filter(t=>t.date===td()).reduce((s,t)=>s+t.pnl,0);return -p>=l;};
const chkDLNext=(data,pnl)=>{const l=data.settings.startBal*data.settings.lossLimitPct/100;const p=data.trades.filter(t=>t.date===td()).reduce((s,t)=>s+t.pnl,0)+pnl;return -p>=l;};
const Lbl=({c,mb=8})=><div style={{fontSize:8,letterSpacing:"2.5px",textTransform:"uppercase",color:C.muted,marginBottom:mb,fontWeight:700}}>{c}</div>;
const GCard=({children,style={},onClick})=><div onClick={onClick} className="gl" style={{padding:14,marginBottom:10,...style}}>{children}</div>;
const PBar=({val,color="neon",h=4})=>{
  const bg=color==="neon"?"linear-gradient(90deg,#c89020,#ffd700)":color==="green"?"linear-gradient(90deg,#00c853,#00e87a)":"linear-gradient(90deg,#ff1744,#ff3355)";
  const sh=`0 0 7px ${color==="neon"?"rgba(240,192,64,0.5)":color==="green"?"rgba(0,232,122,0.5)":"rgba(255,51,85,0.5)"}`;
  return <div className="pbt" style={{height:h}}><div className="pbf" style={{width:`${Math.min(100,Math.max(0,val))}%`,background:bg,boxShadow:sh}}/></div>;
};
const Badge=({c,color})=><span className="bdg" style={{background:color+"22",color,border:`1px solid ${color}44`}}>{c}</span>;
const ScoreRing=({score})=>{
  const col=score>=75?C.green:score>=50?C.neon:C.red;
  const r=25,circ=2*Math.PI*r;
  return <div style={{position:"relative",width:60,height:60}}>
    <svg width="60" height="60" viewBox="0 0 60 60" style={{transform:"rotate(-90deg)"}}>
      <circle cx="30" cy="30" r={r} fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth="5"/>
      <circle cx="30" cy="30" r={r} fill="none" stroke={col} strokeWidth="5" strokeLinecap="round"
        strokeDasharray={`${circ*score/100} ${circ}`} style={{filter:`drop-shadow(0 0 5px ${col}99)`,transition:"stroke-dasharray 0.6s"}}/>
    </svg>
    <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
      <div style={{color:col,fontSize:13,fontWeight:900,lineHeight:1}}>{score}</div>
      <div style={{color:col,fontSize:6,letterSpacing:1.5,fontWeight:700}}>{score>=75?"ELITE":score>=50?"AVG":"POOR"}</div>
    </div>
  </div>;
};
function LoginScreen({onLogin}){
  const[u,setU]=useState("");const[p,setP]=useState("");const[err,setErr]=useState("");const[load,setL]=useState(false);
  const go=()=>{if(!u||!p){setErr("Enter credentials");return;}setL(true);setTimeout(()=>{const usr=LS.users().find(x=>x.username===u&&x.password===hsh(p)&&x.active!==false);if(usr){LS.setS(u);onLogin(usr);}else{setErr("Invalid credentials");setL(false);}},700);};
  return <div style={{minHeight:"100vh",background:"radial-gradient(ellipse at 20% 50%,rgba(240,192,64,0.05),transparent 60%),#020609",display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
    <div style={{width:"100%",maxWidth:340,animation:"fadeUp 0.5s ease forwards"}}>
      <div style={{textAlign:"center",marginBottom:32}}>
        <div style={{fontSize:9,letterSpacing:4,color:C.muted,marginBottom:9,fontWeight:700}}>◈ TRADING TERMINAL ◈</div>
        <div style={{fontSize:20,fontWeight:900,letterSpacing:2}}>HUZAIB KHAN</div>
        <div style={{fontSize:10,letterSpacing:3,color:C.neon,marginTop:5,fontWeight:700,textShadow:"0 0 18px rgba(240,192,64,0.5)"}}>ELITE DISCIPLINE TERMINAL</div>
        <div style={{width:48,height:1,background:"linear-gradient(90deg,transparent,#f0c040,transparent)",margin:"12px auto 0"}}/>
      </div>
      <div className="gl" style={{padding:24}}>
        <Lbl c="Username"/><input value={u} onChange={e=>setU(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()} placeholder="Enter username" className="ei" style={{marginBottom:13}}/>
        <Lbl c="Password"/><input type="password" value={p} onChange={e=>setP(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()} placeholder="••••••••" className="ei" style={{marginBottom:16}}/>
        {err&&<div style={{color:C.red,fontSize:11,marginBottom:11,textAlign:"center"}}>{err}</div>}
        <button onClick={go} disabled={load} className="bn">{load?"VERIFYING...":"ENTER TERMINAL →"}</button>
      </div>
      <div style={{textAlign:"center",color:C.muted,fontSize:8,marginTop:14,letterSpacing:2}}>LICENSED · UNAUTHORIZED ACCESS PROHIBITED</div>
    </div>
  </div>;
}
function AdminPanel({onLogout}){
  const[tab,setTab]=useState("users");
  const[users,setUsers]=useState(()=>LS.users().filter(u=>u.role==="trader"));
  const[form,setForm]=useState({name:"",username:"",password:""});
  const[msg,setMsg]=useState("");const[expand,setExpand]=useState(null);
  const rf=()=>setUsers(LS.users().filter(u=>u.role==="trader"));
  const sm=m=>{setMsg(m);setTimeout(()=>setMsg(""),3000)};
  const create=()=>{if(!form.name||!form.username||!form.password){sm("❌ Fill all fields");return;}const all=LS.users();if(all.find(u=>u.username===form.username)){sm("❌ Username taken");return;}LS.saveU([...all,{id:Date.now(),username:form.username,password:hsh(form.password),role:"trader",name:form.name,active:true}]);LS.saveD(form.username,defData());setForm({name:"",username:"",password:""});rf();sm("✅ Created: @"+form.username);};
  const toggle=u=>{LS.saveU(LS.users().map(x=>x.id===u.id?{...x,active:!x.active}:x));rf();};
  const del=u=>{if(!window.confirm("Delete "+u.name+"?"))return;LS.saveU(LS.users().filter(x=>x.id!==u.id));localStorage.removeItem("edt_d_"+u.username);rf();sm("🗑 Deleted");};
  const total=users.reduce((s,u)=>{const d=LS.data(u.username);return s+(d?.trades?.length||0)},0);
  return <div style={{background:C.bg0,height:"100vh",overflow:"auto"}}>
    <div style={{background:"rgba(2,6,9,0.97)",borderBottom:"1px solid rgba(255,255,255,0.07)",padding:"12px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:0,zIndex:10}}>
      <div><div style={{color:C.neon,fontSize:10,fontWeight:900,letterSpacing:3}}>◈ ADMIN TERMINAL</div><div style={{color:C.muted,fontSize:7,letterSpacing:2,marginTop:2}}>ELITE DISCIPLINE SYSTEM</div></div>
      <div style={{display:"flex",gap:8,alignItems:"center"}}><Badge c="👑 ADMIN" color={C.green}/><button onClick={onLogout} className="bg" style={{width:"auto",padding:"5px 12px",fontSize:9}}>EXIT</button></div>
    </div>
    <div style={{padding:13,maxWidth:500,margin:"0 auto"}}>
      {msg&&<div style={{background:msg.includes("❌")?"rgba(255,51,85,0.1)":"rgba(0,232,122,0.1)",border:`1px solid ${msg.includes("❌")?"rgba(255,51,85,0.3)":"rgba(0,232,122,0.3)"}`,borderRadius:9,padding:"8px 12px",marginBottom:11,color:msg.includes("❌")?C.red:C.green,fontSize:11,fontWeight:700,textAlign:"center"}}>{msg}</div>}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:13}}>
        {[{l:"Traders",v:users.length,c:C.blue},{l:"Active",v:users.filter(u=>u.active!==false).length,c:C.green},{l:"Trades",v:total,c:C.neon}].map(s=><div key={s.l} className="gl" style={{padding:"11px 7px",textAlign:"center",borderRadius:13}}><div style={{color:s.c,fontSize:20,fontWeight:900}}>{s.v}</div><div style={{color:C.muted,fontSize:7,letterSpacing:1.5,marginTop:2}}>{s.l}</div></div>)}
      </div>
      <div style={{display:"flex",gap:6,marginBottom:13}}>{[["users","👥 Users"],["add","➕ Create"],["stats","📊 Stats"]].map(([id,lbl])=><button key={id} onClick={()=>setTab(id)} className={`tb ${tab===id?"on":""}`} style={{flex:1}}>{lbl}</button>)}</div>
      {tab==="users"&&<div>
        {!users.length&&<div style={{textAlign:"center",padding:"32px 0",color:C.muted,fontSize:12}}>No traders yet</div>}
        {users.map(u=>{const d=LS.data(u.username);const ts=d?.trades||[];const ws=ts.filter(t=>t.result==="WIN").length;const wr=pc(ws,ts.length);const isO=expand===u.id;
          return <GCard key={u.id} onClick={()=>setExpand(isO?null:u.id)} style={{borderLeft:`3px solid ${u.active!==false?C.green:C.red}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div><div style={{fontWeight:800,fontSize:13,marginBottom:5}}>{u.name}</div><div style={{display:"flex",gap:5}}><Badge c={"@"+u.username} color={C.muted2}/><Badge c={u.active!==false?"ACTIVE":"INACTIVE"} color={u.active!==false?C.green:C.red}/></div></div>
              <div style={{textAlign:"right"}}><div style={{fontWeight:800}}>{ts.length} trades</div><div style={{color:wr>=60?C.green:wr>=40?C.neon:C.red,fontSize:11,fontWeight:700}}>{wr}% WR</div></div>
            </div>
            {isO&&<div style={{marginTop:11,borderTop:"1px solid rgba(255,255,255,0.06)",paddingTop:11}} onClick={e=>e.stopPropagation()}>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:9}}>{[["Balance",fm(d?.balance||0)],["Trades",ts.length],["Wins",ws],["Losses",ts.length-ws]].map(([l,v])=><div key={l} className="gl2" style={{padding:"6px 8px",textAlign:"center"}}><div style={{color:C.muted,fontSize:7}}>{l}</div><div style={{fontWeight:800,fontSize:12,marginTop:1}}>{v}</div></div>)}</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:6}}>
                <button onClick={()=>toggle(u)} className="bn" style={{fontSize:9,background:u.active?"rgba(255,51,85,0.1)":"rgba(0,232,122,0.1)",borderColor:u.active?"rgba(255,51,85,0.4)":"rgba(0,232,122,0.4)",color:u.active?C.red:C.green}}>{u.active?"🔒 DEACTIVATE":"✅ ACTIVATE"}</button>
                <button onClick={()=>{const pw=prompt("New password:");if(pw){LS.saveU(LS.users().map(x=>x.id===u.id?{...x,password:hsh(pw)}:x));sm("✅ Password reset");}}} className="bg" style={{fontSize:9}}>🔑 RESET</button>
              </div>
              <button onClick={()=>del(u)} style={{width:"100%",background:"transparent",border:"1px solid rgba(255,51,85,0.3)",color:C.red,borderRadius:8,padding:"7px",fontSize:9,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>🗑 DELETE ALL DATA</button>
            </div>}
          </GCard>;
        })}
      </div>}
      {tab==="add"&&<GCard>
        <div className="st">New Trader Account</div>
        {[["Full Name",form.name,v=>setForm(p=>({...p,name:v})),"text","John Doe"],["Username",form.username,v=>setForm(p=>({...p,username:v.toLowerCase().replace(/\s/,"")})),"text","john_doe"],["Password",form.password,v=>setForm(p=>({...p,password:v})),"password","Secure password"]].map(([l,val,fn,t,ph])=><div key={l} style={{marginBottom:11}}><Lbl c={l}/><input value={val} onChange={e=>fn(e.target.value)} placeholder={ph} type={t} className="ei"/></div>)}
        <button onClick={create} className="bn">CREATE ACCOUNT</button>
      </GCard>}
      {tab==="stats"&&<div>{users.map(u=>{const d=LS.data(u.username);const ts=d?.trades||[];const ws=ts.filter(t=>t.result==="WIN").length;const pnl=ts.reduce((s,t)=>s+t.pnl,0);const wr=pc(ws,ts.length);
        return <GCard key={u.id}><div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}><div style={{fontWeight:800}}>{u.name}</div><Badge c={u.active!==false?"ACTIVE":"INACTIVE"} color={u.active!==false?C.green:C.red}/></div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:5,marginBottom:8}}>{[["T",ts.length,C.blue],["WR",wr+"%",wr>=60?C.green:wr>=40?C.neon:C.red],["Pn
